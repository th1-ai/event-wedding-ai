# ---------------------------------------------------------------------------
# agent.yaml - Event & Wedding AI's own knobs. `make setup` copies this to
# config/agent.yaml; edit that copy, this example stays as a clean reference.
#
# Every write this agent makes still goes through mode: shadow / live and
# review.require_approval_for in config/hotel.yaml - nothing here loosens
# that. See docs/safety.md and docs/how-it-works.md ("Modes").
# ---------------------------------------------------------------------------

# --- Which systems this agent actually uses through core/adapters ----------
# The function-space diary and the rate card below are this agent's OWN
# tables, seeded from this file - not a PMS call (docs/how-it-works.md
# design decision 7, and the "PMS" row of docs/integrations.md). So pms is
# left out here on purpose: systems.pms.adapter stays mock until someone
# wires the room-block write, and it must never trigger the "SAMPLE DATA"
# warning on the review queue. Listing email (every event thread) and
# messaging (the escalation nudge, and Event Outreach AI's WhatsApp steps)
# still warns you correctly if THOSE are left on mock once you run for real.
systems_used: [email, messaging]

# Co-pilot ("every send waits for your OK") or autopilot ("routine sends go
# out on their own - pricing still comes to you"). A counter-offer is held in
# BOTH. This only changes routine sends (replies, chases, deposit reminders,
# site-visit offers); mode: shadow in hotel.yaml still blocks everything
# regardless of this flag - see docs/how-it-works.md.
autopilot: false

# --- Cadence and thresholds, from the spec's own constants ------------------
chase_silence_days: 5          # a pinged client item silent this long gets one chase
deposit_window_days: 14        # an unpaid deposit inside this window gets a reminder
hold_expiry_days: 7            # an AI-placed space hold is good for this long
negotiation_band_pct: 8        # the most the AI may counter - a hard ceiling, always held
wedding_saturday_uplift: 600   # per qualifying space-use, weddings only
uplift_spaces: [grand-ballroom, garden-terrace]   # the only spaces that carry the uplift
default_wedding_spaces: [grand-ballroom, garden-terrace]   # used when an enquiry lists no spaces yet
alt_date_steps: [-7, 7, -14, 14, -21, 21]          # alternate-date probe order, nearest first
site_visit_slots:              # offered relative to the day cursor
  - {offset: 4, time: "11:00"}
  - {offset: 6, time: "15:00"}
  - {offset: 8, time: "16:30"}
enquiry_attachments: [event-spaces-brochure, events-pricing-sheet]
menus_doc: catering-menus

# --- The seven behavioural toggles ------------------------------------------
# Flip one off to see exactly what stops happening - each is named for what
# it proves when it is off. See docs/safety.md.
rules:
  checklist_templates: true    # off -> every new enquiry gets the 6-item generic list
  site_visit_offer: true       # off -> no slots offered; the visit waits for a human
  hold_expiry: true            # off -> holds sit on the diary indefinitely
  follow_up_5d: true           # off -> the chase never fires
  deposit_reminder_14d: true   # off -> the reminder is never drafted
  negotiation_band: true       # off -> the ask escalates with no counter drafted at all
  attach_materials: true       # off -> replies go out as plain text, no attachments

# --- Venue inventory ---------------------------------------------------------
# Edit this to match your own function spaces. Capacities are per layout.
# A restaurant install: drop grand-ballroom/garden-suite, keep
# private-dining-room and add a `whole-venue` row - see docs/integrations.md.
spaces:
  - slug: grand-ballroom
    name: "Grand Ballroom"
    capacities: {banquet: 160, theatre: 200, cabaret: 110, standing: 240}
  - slug: garden-terrace
    name: "Garden Terrace"
    capacities: {standing: 120, banquet: 80}
  - slug: private-dining-room
    name: "Private Dining Room"
    capacities: {private_dining: 22, composite: 36}
  - slug: boardroom
    name: "Boardroom"
    capacities: {boardroom: 12}
  - slug: garden-suite
    name: "Garden Suite"
    capacities: {theatre: 36, cabaret: 20}

# --- Rate card ----------------------------------------------------------------
# Venue rows are EUR per day; package rows are EUR per person. Three season
# bands: low / shoulder / peak. tools/pricing.py:build_quote() is the ONLY
# place a price is computed - the BEO and the pricing sheet call it too, so
# they cannot disagree. See docs/how-it-works.md "Never quote off memory".
rates:
  venue:
    grand-ballroom:      {low: 2000, shoulder: 2500, peak: 3100}
    garden-terrace:      {low: 1300, shoulder: 1650, peak: 2000}
    private-dining-room: {low: 380,  shoulder: 460,  peak: 600}
    boardroom:           {low: 220,  shoulder: 270,  peak: 320}
    garden-suite:        {low: 650,  shoulder: 820,  peak: 1000}
  package:
    silver:       {low: 70,  shoulder: 78,  peak: 90}
    gold:         {low: 98,  shoulder: 110, peak: 126}
    platinum:     {low: 136, shoulder: 150, peak: 173}
    day-delegate: {low: 78,  shoulder: 86,  peak: 99}

