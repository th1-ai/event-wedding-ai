# --- Event Outreach AI ("The Rainmaker") - folded-in sub-agent --------------
# Off by default: the planner sweep is fully useful on its own, working
# whatever enquiries already exist. Turn this on when you want the calendar
# filled from the outside too. See docs/sub-agents.md and workflows/20-event-outreach.md.
subagents:
  event_outreach:
    enabled: false
    daily_caps: {linkedin: 10, email: 8, whatsapp: 5, instagram: 5}
    warmup_ramp: true          # a young inbox is capped below its nominal daily cap
    weekend_pause: true        # nothing sends on day 5/6 of each campaign week
    stop_on_reply: true        # NEVER turn this off outside a test - see docs/safety.md
    withdraw_after_days: 7     # unaccepted LinkedIn invite withdrawn quietly
    suppress_dnc: true         # NEVER turn this off outside a test
    source_vetting: true       # only approved/testing signal sources feed a scan
    ai_personalization: true   # off -> every lead gets the same generic opener
    meeting_value: 12500       # est_value (in config/hotel.yaml: currency) stamped on the handed-off event row
    enrich_cost_eur: {hunter: 0.034, findymail: 0.049}

# --- Recurring jobs ----------------------------------------------------------
# A MAPPING of job name -> {command, cadence} - `tools/schedule.py` requires
# this exact shape (`isinstance(block, dict)`), and README "What runs when"
# must keep matching it. `cadence:` is a 5-field cron expression or one of
# core/schedule.py: CADENCES ("every-15-min", "hourly", "nightly", "morning",
# "weekly", ...) - free text like "daily at 07:30" is neither, and silently
# falls back to every-15-min. See SIMULATION.md Finding 2.
# `command:` has NO "python3 " prefix - core/schedule.py's render() already
# puts the right interpreter in front of it (the venv's if there is one),
# so a prefix here would produce a crontab line that tries to run a script
# literally named "python3".
# `make schedule ARGS="--all"` prints one ready-to-install snippet per job.
schedule:
  planner-sweep:
    command: "tools/run.py --once"
    cadence: "30 7 * * *"    # daily at 07:30
  intake:
    command: "tools/run.py --once --intake"
    cadence: "every-15-min"
  review-digest:
    command: "tools/report.py --digest"
    cadence: "0 8 * * *"     # daily at 08:00
  outreach-tick:
    # Only meaningful once subagents.event_outreach.enabled is true above -
    # tools/outreach.py tick is a no-op otherwise, see docs/sub-agents.md.
    command: "tools/outreach.py tick"
    cadence: "0 9 * * *"     # daily at 09:00
